<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Key metrics" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif}
.c{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
.n{font-size:46px;font-weight:700;fill:#f5f5f7;letter-spacing:-1px}
.l{font-size:16px;font-weight:600;fill:#f5f5f7}
.s{font-size:12px;fill:#8e8e93}
.r{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:138.2;transform:rotate(-90deg);transform-box:fill-box;transform-origin:center}
.t{fill:none;stroke:#2c2c2e;stroke-width:5}
</style>
<g class="c" style="animation-delay:.1s"><rect x="15" y="20" width="220" height="160" rx="26" fill="#1c1c1e" stroke="#2c2c2e"/>
<circle class="t" cx="190" cy="62" r="22"/><circle class="r" cx="190" cy="62" r="22" stroke="#0a84ff" stroke-dashoffset="138.2"><animate attributeName="stroke-dashoffset" from="138.2" to="30" dur="1.8s" begin=".5s" fill="freeze"/></circle>
<text class="n" x="38" y="110">6+</text><text class="l" x="38" y="140">Years</text><text class="s" x="38" y="160">Building iOS since 2019</text></g>
<g class="c" style="animation-delay:.3s"><rect x="265" y="20" width="220" height="160" rx="26" fill="#1c1c1e" stroke="#2c2c2e"/>
<circle class="t" cx="440" cy="62" r="22"/><circle class="r" cx="440" cy="62" r="22" stroke="#bf5af2" stroke-dashoffset="138.2"><animate attributeName="stroke-dashoffset" from="138.2" to="20" dur="1.8s" begin=".7s" fill="freeze"/></circle>
<text class="n" x="288" y="110">100K+</text><text class="l" x="288" y="140">Daily users</text><text class="s" x="288" y="160">Hamrah Bank Mellat</text></g>
<g class="c" style="animation-delay:.5s"><rect x="515" y="20" width="220" height="160" rx="26" fill="#1c1c1e" stroke="#2c2c2e"/>
<circle class="t" cx="690" cy="62" r="22"/><circle class="r" cx="690" cy="62" r="22" stroke="#30d158" stroke-dashoffset="138.2"><animate attributeName="stroke-dashoffset" from="138.2" to="1" dur="1.8s" begin=".9s" fill="freeze"/></circle>
<text class="n" x="538" y="110">99.9%</text><text class="l" x="538" y="140">Uptime</text><text class="s" x="538" y="160">Production banking app</text></g>
<g class="c" style="animation-delay:.7s"><rect x="765" y="20" width="220" height="160" rx="26" fill="#1c1c1e" stroke="#2c2c2e"/>
<circle class="t" cx="940" cy="62" r="22"/><circle class="r" cx="940" cy="62" r="22" stroke="#ff9f0a" stroke-dashoffset="138.2"><animate attributeName="stroke-dashoffset" from="138.2" to="40" dur="1.8s" begin="1.1s" fill="freeze"/></circle>
<text class="n" x="788" y="110">10</text><text class="l" x="788" y="140">Shipped apps</text><text class="s" x="788" y="160">Banking, tracking, calling</text></g>
</svg>
