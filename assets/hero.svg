<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Hossein Rezazadeh Janati, Senior iOS Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#8ec5ff"/><stop offset="1" stop-color="#ffffff"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="500 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0a84ff"><animate attributeName="stop-color" values="#0a84ff;#5e5ce6;#0a84ff" dur="8s" repeatCount="indefinite"/></stop>
<stop offset="1" stop-color="#bf5af2"><animate attributeName="stop-color" values="#bf5af2;#ff375f;#bf5af2" dur="8s" repeatCount="indefinite"/></stop>
</linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<clipPath id="screen"><rect x="8" y="8" width="164" height="344" rx="30"/></clipPath>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif}
.in{opacity:0;animation:up 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.d1{animation-delay:.2s}.d2{animation-delay:.5s}.d3{animation-delay:.8s}.d4{animation-delay:1.1s}
.cyc{opacity:0;animation:cyc 12s infinite}
@keyframes cyc{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-10px)}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(770px,30px)}50%{transform:translate(770px,18px)}}
.ic{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
<rect width="1000" height="420" rx="28" fill="#000"/>
<g filter="url(#blur)" opacity=".55">
<circle r="130" fill="#0a84ff" cx="200" cy="120"><animate attributeName="cx" values="200;420;200" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="120;260;120" dur="11s" repeatCount="indefinite"/></circle>
<circle r="120" fill="#bf5af2" cx="700" cy="300"><animate attributeName="cx" values="700;520;700" dur="13s" repeatCount="indefinite"/><animate attributeName="cy" values="300;120;300" dur="10s" repeatCount="indefinite"/></circle>
<circle r="90" fill="#ff375f" cx="880" cy="80"><animate attributeName="cx" values="880;780;880" dur="9s" repeatCount="indefinite"/></circle>
</g>
<rect width="1000" height="420" rx="28" fill="none" stroke="#2c2c2e"/>

<text class="in d1" x="60" y="115" font-size="14" font-weight="600" letter-spacing="4" fill="#0a84ff">iOS  ·  BANKING  ·  REAL-TIME</text>
<text class="in d2" x="60" y="185" font-size="48" font-weight="700" letter-spacing="-1.5" fill="url(#name)">Hossein Rezazadeh Janati</text>
<text class="in d3" x="60" y="235" font-size="28" font-weight="500" fill="#a1a1a6">Senior iOS Developer</text>

<g class="in d4">
<text class="cyc" x="60" y="298" font-size="20" fill="#f5f5f7" style="animation-delay:0s">Shipping to 100,000+ daily users.</text>
<text class="cyc" x="60" y="298" font-size="20" fill="#f5f5f7" style="animation-delay:3s">Swift · SwiftUI · UIKit · Combine.</text>
<text class="cyc" x="60" y="298" font-size="20" fill="#f5f5f7" style="animation-delay:6s">Banking-grade security, built in.</text>
<text class="cyc" x="60" y="298" font-size="20" fill="#f5f5f7" style="animation-delay:9s">Real-time calls with WebRTC.</text>
<text x="60" y="360" font-size="14" fill="#6e6e73">Tehran, Iran  ·  Open to relocate to Canada</text>
</g>

<g class="float">
<rect x="0" y="0" width="180" height="360" rx="40" fill="#1c1c1e" stroke="#48484a" stroke-width="2"/>
<g clip-path="url(#screen)">
<rect x="8" y="8" width="164" height="344" fill="url(#wall)"/>
<text x="90" y="82" font-size="36" font-weight="600" fill="#fff" text-anchor="middle">9:41</text>
<g class="ic"><rect x="18" y="116" width="30" height="30" rx="8" fill="#fff" opacity=".9"/></g>
<g class="ic" style="animation-delay:.3s"><rect x="56" y="116" width="30" height="30" rx="8" fill="#30d158"/></g>
<g class="ic" style="animation-delay:.6s"><rect x="94" y="116" width="30" height="30" rx="8" fill="#ff9f0a"/></g>
<g class="ic" style="animation-delay:.9s"><rect x="132" y="116" width="30" height="30" rx="8" fill="#000" opacity=".55"/></g>
<rect x="18" y="168" width="144" height="86" rx="18" fill="#fff" opacity=".2"/>
<text x="30" y="190" font-size="11" font-weight="600" fill="#fff" opacity=".85">Activity</text>
<rect x="34" y="206" width="12" height="40" rx="4" fill="#fff"><animate attributeName="height" values="14;40;14" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="232;206;232" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="58" y="206" width="12" height="40" rx="4" fill="#fff"><animate attributeName="height" values="34;16;34" dur="2.8s" repeatCount="indefinite"/><animate attributeName="y" values="212;230;212" dur="2.8s" repeatCount="indefinite"/></rect>
<rect x="82" y="206" width="12" height="40" rx="4" fill="#fff"><animate attributeName="height" values="22;40;22" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="224;206;224" dur="2.1s" repeatCount="indefinite"/></rect>
<rect x="106" y="206" width="12" height="40" rx="4" fill="#fff"><animate attributeName="height" values="38;20;38" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="208;226;208" dur="3s" repeatCount="indefinite"/></rect>
<rect x="130" y="206" width="12" height="40" rx="4" fill="#fff"><animate attributeName="height" values="18;36;18" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="228;210;228" dur="2.6s" repeatCount="indefinite"/></rect>
<rect x="18" y="286" width="144" height="46" rx="20" fill="#fff" opacity=".22"/>
<circle cx="45" cy="309" r="12" fill="#fff" opacity=".85"/><circle cx="78" cy="309" r="12" fill="#30d158"/><circle cx="111" cy="309" r="12" fill="#0a84ff"/><circle cx="144" cy="309" r="12" fill="#ff375f"/>
</g>
<rect x="62" y="18" width="56" height="17" rx="8.5" fill="#000"/>
<rect x="62" y="342" width="56" height="5" rx="2.5" fill="#fff" opacity=".7"/>
</g>
</svg>
